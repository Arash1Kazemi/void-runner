<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LED style preview</title>
<!--
  Shows how Wokwi's own LED part (wokwi-led, loaded from the @wokwi/elements package)
  looks with different body / light colours, on and off, at normal size and zoomed out.
  Used to pick the LED colours for tools/gen_circuit.py.
-->
<style>
  body { background: #353535; color: #ddd; font: 13px sans-serif; margin: 12px; }
  .grid { display: flex; flex-wrap: wrap; gap: 26px; }
  .panel { display: grid; grid-template-columns: repeat(5, 44px); grid-auto-rows: 46px; }
  .zoom { transform: scale(0.35); transform-origin: top left; height: 60px; }
  h3 { margin: 4px 0; font-weight: normal; }
</style>
<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@wokwi/elements@1.9.2/+esm';
  // body colour per style; light colours per row: red, white, green zones
  const STYLES = {
    'current (body = zone colour)': ['red', 'white', 'green'],
    'hex dark body (lint warning)': ['#3a1818', '#2c2c2c', '#183a1c'],
    'valid name "blue" body': ['blue', 'blue', 'blue'],
    'valid name "purple" body': ['purple', 'purple', 'purple'],
  };
  const LIGHT = ['#ff3a3a', '#ffffff', '#3aff4a'];
  const lit = (x, y) => (y === 0 && x === 2) || (y === 1 && x >= 1 && x <= 3) || (y === 2 && x <= 4 && x >= 0 && x !== 4);
  const grid = document.querySelector('.grid');
  for (const zoom of [false, true]) {
    for (const [name, bodies] of Object.entries(STYLES)) {
      const box = document.createElement('div');
      box.innerHTML = `<h3>${name}${zoom ? ' @35%' : ''}</h3>`;
      const panel = document.createElement('div');
      panel.className = 'panel';
      for (let y = 0; y < 3; y++) for (let x = 0; x < 5; x++) {
        const led = document.createElement('wokwi-led');
        led.color = bodies[y];
        if (name.startsWith('current') === false) led.lightColor = LIGHT[y];
        led.value = lit(x, y);
        led.brightness = lit(x, y) ? 1 : 0;
        panel.appendChild(led);
      }
      if (zoom) { const z = document.createElement('div'); z.className = 'zoom'; z.appendChild(panel); box.appendChild(z); }
      else box.appendChild(panel);
      grid.appendChild(box);
    }
  }
</script>
</head>
<body>
  <div class="grid"></div>
</body>
</html>
