<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rock design preview</title>
<!--
  Compares space-rock designs on the VOID RUNNER screen, drawn with Wokwi's real LED element
  the way Wokwi shows our multiplexed screen (8 subframes at fps 300, gamma 30, like
  text_preview.html). Same scene in every panel: a drone shooting down, the player firing up,
  a big and a small rock falling and drifting at their real game speeds. Serve the project
  folder and open /tools/rock_preview.html.
-->
<style>
  body { background: #2d2d2d; color: #ddd; font: 14px sans-serif; margin: 10px; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .box { width: 260px; }
  h3 { margin: 2px 0 2px; font-size: 15px; }
  p { margin: 0 0 6px; font-size: 12px; color: #aaa; height: 32px; }
  .scale { transform: scale(0.36); transform-origin: top left; width: 254px; height: 470px; }
  .panel { display: grid; grid-template-columns: repeat(16, 44px); grid-auto-rows: 46px; width: 704px; }
  .gap { grid-column: 1 / span 16; height: 24px; }
  pre { color: #aaa; font-size: 12px; }
</style>
<script type="module">
import 'https://cdn.jsdelivr.net/npm/@wokwi/elements@1.9.2/+esm';

const W = 16, H = 24, ROWS = 27, LOOP_MS = 9600;
const newFrame = () => new Array(ROWS).fill(0);
function px(f, x, y) { if (x >= 0 && x < W && y >= 0 && y < H) f[y] |= 1 << x; }
function shape(f, x, y, rows) { rows.forEach((r, j) => [...r].forEach((c, i) => c === '#' && px(f, x + i, y + j))); }

// ---- the sprites (art.h)
const DRONE = ['#.#', '.#.'], SHIP = ['.#.', '###', '###'];
const ROCK_SMALL = ['##', '##'], ROCK_BIG = ['.##', '###', '##.'];
const rotate = s => s[0].split('').map((_, c) => s.map((_, r) => s[s.length - 1 - r][c]).join(''));   // 90° clockwise
const turns = s => [s, rotate(s), rotate(rotate(s)), rotate(rotate(rotate(s)))];
const TUMBLE_SMALL = turns(['#.', '##']), TUMBLE_BIG = turns(['.##', '###', '#..']);
const HOLLOW_SMALL = ['##.', '#.#', '.##'], HOLLOW_BIG = ['.##.', '#..#', '#.##', '.##.'];
const TUMBLE_MS = 250;

// ---- a falling rock: y from its speed (ms per row), drifts sideways every 1400 ms, bounces
function rockPos(t, start, x0, dir, stepMs, w) {
  const y = -w + Math.floor((t - start) / stepMs);
  let x = x0, d = dir;
  for (let k = 0; k < Math.floor((t - start) / 1400); k++) {
    x += d;
    if (x < 0 || x > W - w) { x -= 2 * d; d = -d; }
  }
  return [x, y];
}

// ---- the scene; rock(size, t) gives the rock picture of each design
function scene(f, t, rock) {
  const dy = -2 + Math.floor(t / 450);                       // drone: 450 ms per row
  shape(f, 2, dy, DRONE);
  for (let s = 600; s < t; s += 1500) {                      // drone shot: every 1.5 s, 100 ms per row
    const sy = (-2 + Math.floor(s / 450)) + 2 + Math.floor((t - s) / 100);
    px(f, 3, sy);
  }
  shape(f, 6, 21, SHIP);                                     // player + its 2-pixel bullet (35 ms per row)
  const by = 20 - Math.floor((t % 900) / 35);
  if (by >= 0) { px(f, 7, by); px(f, 7, by + 1); }
  if (t >= 0) { const [x, y] = rockPos(t, 0, 9, 1, 420, 3); shape(f, x, y, rock('big', t, 0)); }
  if (t >= 2500) { const [x, y] = rockPos(t, 2500, 13, -1, 260, 2); shape(f, x, y, rock('small', t, 1)); }
  if (t >= 5500) { const [x, y] = rockPos(t, 5500, 1, 1, 420, 3); shape(f, x, y, rock('big', t, 2)); }
  f[24] = 0x0fff; f[25] = 0x03ff; f[26] = 0x0777;
}

const now = (f, t) => scene(f, t, size => size === 'big' ? ROCK_BIG : ROCK_SMALL);
const tumble = (f, t) => scene(f, t, (size, t, i) => {
  const step = (Math.floor(t / TUMBLE_MS) + i) & 3;          // each rock starts at a different turn
  return (size === 'big' ? TUMBLE_BIG : TUMBLE_SMALL)[step];
});
const hollow = (f, t) => scene(f, t, size => size === 'big' ? HOLLOW_BIG : HOLLOW_SMALL);

// ---- Wokwi's way of showing it: average over 8 subframes of 1/fps, then gamma 30
const GAMMA = 30, DUTY = 1 / 27, PICTURE_MS = 20, FPS = 300;
const ZONE = r => r >= 24 ? ['#3a1818', '#3a3214', '#183a1c'][r - 24] : r < 6 ? '#3a1818' : r < 18 ? '#2c2c2c' : '#183a1c';
const LIGHT = r => r >= 24 ? ['#ff3a3a', '#ffd23a', '#3aff4a'][r - 24] : r < 6 ? '#ff3a3a' : r < 18 ? '#ffffff' : '#3aff4a';
const ORDER = [24, 25, 26, -1, ...Array.from({ length: 24 }, (_, i) => i)];   // status bars on top

function makePanel(title, note, draw) {
  const box = document.createElement('div');
  box.className = 'box';
  box.innerHTML = `<h3>${title}</h3><p>${note}</p>`;
  const scale = document.createElement('div'), panel = document.createElement('div');
  scale.className = 'scale'; panel.className = 'panel';
  const leds = [];
  for (const r of ORDER) {
    if (r < 0) { const g = document.createElement('div'); g.className = 'gap'; panel.appendChild(g); continue; }
    leds[r] = [];
    for (let x = 0; x < W; x++) {
      const led = document.createElement('wokwi-led');
      led.color = ZONE(r); led.lightColor = LIGHT(r);
      panel.appendChild(led); leds[r][x] = led;
    }
  }
  scale.appendChild(panel); box.appendChild(scale);
  document.querySelector('.row').appendChild(box);
  return { draw, keep: Math.max(1, Math.round(8000 / FPS / PICTURE_MS)), history: [], leds, last: [] };
}

const panels = [
  makePanel('1. Now', 'solid rocks: 2×2 and 3×3 blocks', now),
  makePanel('2. A: tumbling (recommended)', 'same sizes, one quarter turn every 250 ms', tumble),
  makePanel('3. B: hollow + lumpy', 'crater shapes, 3×3 and 4×4 (bigger hit box)', hollow),
];

let t = 0;
setInterval(() => {
  t = (t + PICTURE_MS) % LOOP_MS;
  for (const p of panels) {
    const f = newFrame(); p.draw(f, t);
    p.history.push(f);
    while (p.history.length > p.keep) p.history.shift();
    for (let r = 0; r < ROWS; r++) for (let x = 0; x < W; x++) {
      const on = p.history.filter(h => h[r] & (1 << x)).length;
      const b = on ? Math.pow(DUTY * on / p.history.length, 1 / GAMMA) : 0;
      const key = r * W + x;
      if (p.last[key] !== b) {
        p.last[key] = b;
        const led = p.leds[r][x];
        led.value = b > 0; led.brightness = b;
      }
    }
  }
}, PICTURE_MS);

document.querySelector('pre').textContent =
  'A tumble frames:\n' + TUMBLE_BIG.map((_, i) => TUMBLE_BIG[i].join('\n')).join('\n\n') + '\n\n' +
  TUMBLE_SMALL.map(s => s.join('\n')).join('\n\n');
</script>
</head>
<body>
  <div class="row"></div>
  <pre></pre>
</body>
</html>
