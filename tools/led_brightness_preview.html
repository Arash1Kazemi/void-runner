<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LED brightness preview</title>
<!--
  How bright a lit LED of the VOID RUNNER screen looks in Wokwi for different `gamma`
  values of the wokwi-led part, drawn with Wokwi's real LED element.

  Measured on wokwi.com (2026-10-22): an LED that is on 1/27 of the time (our 27-row
  multiplexing) is shown with brightness = (1/27) ^ (1 / gamma):
      gamma 2.8 (default) -> 0.32   6 -> 0.59   10 -> 0.73   20 -> 0.85   always on -> 1.0
  Used to pick the gamma in tools/gen_circuit.py.
-->
<style>
  body { background: #2d2d2d; color: #ddd; font: 13px sans-serif; margin: 12px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; }
  .panel { display: grid; grid-template-columns: repeat(10, 44px); grid-auto-rows: 46px; }
  .zoom { transform: scale(0.375); transform-origin: top left; width: 170px; height: 150px; }
  h3 { margin: 4px 0; font-weight: normal; }
</style>
<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@wokwi/elements@1.9.2/+esm';
  const DUTY = 1 / 27;
  const CASES = [['before: gamma 2.8', 2.8], ['gamma 10', 10], ['after: gamma 30', 30]];
  const BODIES = {
    'bodies now': ['#3a1818', '#2c2c2c', '#183a1c'],
  };
  const LIGHT = ['#ff3a3a', '#ffffff', '#3aff4a'];
  // 10 x 8 picture: a drone in red, a bullet in white, the ship in green
  const PIC = ['..........', '...#.#....', '....#.....', '..........',
               '....#.....', '....#.....', '....#.....', '...###....'];
  const zone = y => (y < 3 ? 0 : y < 6 ? 1 : 2);
  const grid = document.querySelector('.grid');
  for (const [bodyName, bodies] of Object.entries(BODIES)) {
    for (const [name, gamma] of CASES) {
      const box = document.createElement('div');
      const b = Math.pow(DUTY, 1 / gamma);
      box.innerHTML = `<h3>${name} (${Math.round(b * 100)}%) – ${bodyName}</h3>`;
      const panel = document.createElement('div');
      panel.className = 'panel';
      PIC.forEach((row, y) => [...row].forEach(ch => {
        const led = document.createElement('wokwi-led');
        led.color = bodies[zone(y)];
        led.lightColor = LIGHT[zone(y)];
        led.value = ch === '#';
        led.brightness = ch === '#' ? b : 0;
        panel.appendChild(led);
      }));
      const z = document.createElement('div');
      z.className = 'zoom';
      z.appendChild(panel);
      box.appendChild(z);
      grid.appendChild(box);
    }
  }
</script>
</head>
<body>
  <div class="grid"></div>
</body>
</html>
