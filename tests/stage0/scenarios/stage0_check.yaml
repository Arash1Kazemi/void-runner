# Stage 0 automated check (run with: wokwi-cli --scenario scenarios/stage0_check.yaml .)
# Measures both scan methods, presses real keypad buttons (one, then two at once),
# and prints the screen as text.
name: VOID RUNNER stage 0 check
version: 1
author: VOID RUNNER team

steps:
  - wait-serial: '[S0] ready'

  # 1) two seconds of scanning with direct port writes (the default)
  - delay: 2100ms

  # 2) switch to digitalWrite() and measure again
  - write-serial: '!s'
  - wait-serial: '[S0] scan method digitalWrite'
  - delay: 2100ms
  - write-serial: '!s'
  - wait-serial: '[S0] scan method ports'

  # 3) keys: hold W, add R, release R, release W
  - set-control:
      part-id: btn_W
      control: pressed
      value: 1
  - wait-serial: 'DOWN W held:W last:W'
  - set-control:
      part-id: btn_R
      control: pressed
      value: 1
  - wait-serial: 'DOWN R held:WR last:R'
  - set-control:
      part-id: btn_R
      control: pressed
      value: 0
  - wait-serial: 'UP   R held:W last:-'
  - set-control:
      part-id: btn_W
      control: pressed
      value: 0
  - wait-serial: 'UP   W held:- last:-'

  # 4) a letter typed into the Serial terminal by mistake only prints a hint
  - write-serial: 'w'
  - wait-serial: 'keys are going to the Serial terminal'

  # 5) the test card as text
  - delay: 100ms
  - write-serial: '!d'
  - wait-serial: '[DUMP] end'
